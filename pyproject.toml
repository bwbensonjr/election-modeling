[project]
name = "election-modeling"
version = "0.1.0"
description = "Precinct-level data collection for Massachusetts legislative election modeling"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "bambi>=0.14",
    "pymc>=5.10",
    "arviz>=0.19",
    "numpy>=1.26",
    "nutpie>=0.16.8",
]

[project.scripts]
maprecinct = "maprecinct.cli:main"
legmodel = "legmodel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maprecinct", "src/legmodel"]
